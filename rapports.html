<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <meta name="referrer" content="no-referrer">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="js/theme.js"></script>
    <title>Rapports | EJDEN</title>

    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/achats.css">
    <link rel="stylesheet" href="css/document.css">
    <link rel="stylesheet" href="css/rapports-centre.css">
</head>

<body>

    <main class="module-page rc-app">

        <header class="module-header">
            <a href="dashboard.html" class="back-button" aria-label="Retour">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
            </a>
            <div class="module-title">
                <span>ANALYSE</span>
                <h1>Rapports</h1>
            </div>
        </header>

        <section class="rc-controls" aria-label="Période et filtres">
            <div class="rc-grid2">
                <div class="field">
                    <label for="periodSelect">Période</label>
                    <select id="periodSelect"></select>
                </div>
                <div class="field">
                    <label for="compareSelect">Comparer avec</label>
                    <select id="compareSelect"></select>
                </div>
            </div>

            <div class="rc-grid2" id="customRange" hidden>
                <div class="field"><label for="dateFrom">Du</label><input type="date" id="dateFrom"></div>
                <div class="field"><label for="dateTo">Au</label><input type="date" id="dateTo"></div>
            </div>

            <div class="rc-grid2" id="customCompare" hidden>
                <div class="field"><label for="cmpFrom">Comparer du</label><input type="date" id="cmpFrom"></div>
                <div class="field"><label for="cmpTo">Au</label><input type="date" id="cmpTo"></div>
            </div>

            <button type="button" class="secondary-button rc-filter-toggle" id="filtersToggle" aria-expanded="false">Filtres</button>

            <div class="rc-filters" id="filtersPanel" hidden>
                <div class="field"><label for="fProduct">Produit</label><select id="fProduct"></select></div>
                <div class="field"><label for="fCategory">Catégorie</label><select id="fCategory"></select></div>
                <div class="field"><label for="fClient">Client</label><select id="fClient"></select></div>
                <div class="field"><label for="fMethod">Moyen de paiement</label><select id="fMethod"></select></div>
                <div class="field"><label for="fStatus">Statut / type</label><select id="fStatus"></select></div>
                <div class="field"><label for="fUser">Utilisateur</label><select id="fUser" disabled><option>Utilisateur principal</option></select></div>
                <button type="button" class="secondary-button" id="resetFilters">Réinitialiser les filtres</button>
            </div>

            <p class="rc-period" id="periodInfo" aria-live="polite"></p>
        </section>

        <nav class="rc-tabs" id="tabs" role="tablist" aria-label="Sections du module">
            <button type="button" class="rc-tab is-active" data-tab="overview" role="tab">Vue d'ensemble</button>
            <button type="button" class="rc-tab" data-tab="reports" role="tab">Rapports</button>
            <button type="button" class="rc-tab" data-tab="analyses" role="tab">Analyses</button>
            <button type="button" class="rc-tab" data-tab="custom" role="tab">Personnalisé</button>
            <button type="button" class="rc-tab" data-tab="export" role="tab">Export</button>
        </nav>

        <div class="rc-chips" id="subtabs"></div>

        <div class="rc-view" id="view" aria-live="polite"></div>

    </main>

    <div class="rc-print" id="printArea" hidden></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/rapports.js"></script>

</body>

</html>
