name: Build EJDEN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer EJDEN
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler TypeScript
        run: npm run build

      - name: Préparer les fichiers web
        run: |
          rm -rf www android
          mkdir -p www
          cp ./*.html www/
          cp -r css js www/

      - name: Créer le projet Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Appliquer la personnalisation EJDEN
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/drawable-night
          mkdir -p android/app/src/main/res/mipmap-anydpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-night

          cp native/android/drawable/ejden_logo.xml \
            android/app/src/main/res/drawable/ejden_logo.xml

          cp native/android/drawable/ejden_icon_foreground.xml \
            android/app/src/main/res/drawable/ejden_icon_foreground.xml

          cp native/android/drawable/ejden_icon_monochrome.xml \
            android/app/src/main/res/drawable/ejden_icon_monochrome.xml

          cp native/android/drawable-night/ejden_icon_foreground.xml \
            android/app/src/main/res/drawable-night/ejden_icon_foreground.xml

          cp native/android/mipmap-anydpi/ic_launcher.xml \
            android/app/src/main/res/mipmap-anydpi/ic_launcher.xml

          cp native/android/mipmap-anydpi/ic_launcher_round.xml \
            android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          cp native/android/mipmap-anydpi-v26/ic_launcher.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          cp native/android/mipmap-anydpi-v26/ic_launcher_round.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cp native/android/values/ejden_icon_colors.xml \
            android/app/src/main/res/values/ejden_icon_colors.xml

          cp native/android/values-night/ejden_icon_colors.xml \
            android/app/src/main/res/values-night/ejden_icon_colors.xml

          cp native/android/values/styles.xml \
            android/app/src/main/res/values/styles.xml

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Préparer le keystore
        env:
          EJDEN_KEYSTORE_BASE64: ${{ secrets.EJDEN_KEYSTORE_BASE64 }}
        run: |
          echo "$EJDEN_KEYSTORE_BASE64" | base64 --decode > android/ejden-upload.jks

      - name: Configurer la signature Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EJDEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EJDEN_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_block = """    signingConfigs {
              release {
                  storeFile file("../ejden-upload.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEYSTORE_PASSWORD")
              }
          }

          """

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {\n",
                  "android {\n" + signing_block,
                  1
              )

          pattern = r"(buildTypes\s*\{\s*release\s*\{)"

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  pattern,
                  r"\1\n            signingConfig signingConfigs.release",
                  text,
                  count=1
              )

          path.write_text(text)
          PY

      - name: Construire APK Release signé
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EJDEN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EJDEN_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier l'APK Release
        uses: actions/upload-artifact@v4
        with:
          name: EJDEN-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
