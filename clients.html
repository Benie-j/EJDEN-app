<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <meta name="referrer" content="no-referrer">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="js/theme.js"></script>
    <title>Clients | EJDEN</title>

    <link rel="stylesheet" href="css/modules.css">
    <link rel="stylesheet" href="css/credit.css">
</head>

<body>

    <main class="module-page">

        <header class="module-header">

            <a
                href="dashboard.html"
                class="back-button"
                aria-label="Retour au tableau de bord"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </a>

            <div class="module-title">
                <span>COMMERCE</span>
                <h1>Clients</h1>
            </div>

        </header>

        <section class="summary-grid" aria-live="polite">

            <div class="summary-card">
                <span>Clients</span>
                <strong id="summaryClients">0</strong>
            </div>

            <div class="summary-card">
                <span>Total dû</span>
                <strong id="summaryDebt">0</strong>
                <small>FCFA</small>
            </div>

        </section>

        <section class="module-section" id="clientFormSection">

            <h2 id="clientFormTitle">Nouveau client</h2>

            <form id="clientForm" autocomplete="off" novalidate>

                <div class="field">
                    <label for="clientName">Nom du client</label>

                    <input
                        type="text"
                        id="clientName"
                        maxlength="80"
                        placeholder="Ex. : Awa Koné"
                    >
                </div>

                <div class="field">
                    <label for="clientPhone">Téléphone (facultatif)</label>

                    <input
                        type="tel"
                        id="clientPhone"
                        maxlength="20"
                        inputmode="tel"
                        placeholder="Ex. : +225 07 00 00 00 00"
                    >
                </div>

                <div class="form-actions">

                    <button type="submit" class="primary-button" id="clientSubmit">
                        Ajouter le client
                    </button>

                    <button
                        type="button"
                        class="secondary-button"
                        id="clientCancelEdit"
                        hidden
                    >
                        Annuler
                    </button>

                </div>

            </form>

        </section>

        <section class="module-search">

            <input
                type="search"
                id="clientSearch"
                placeholder="Rechercher un client..."
                autocomplete="off"
                maxlength="80"
                aria-label="Rechercher un client"
            >

        </section>

        <section id="clientsEmpty" class="empty-state" hidden>
            <strong id="clientsEmptyTitle">Aucun client</strong>
            <p id="clientsEmptyText">Les clients que vous ajoutez apparaîtront ici.</p>
        </section>

        <section id="clientsList"></section>

    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/clients.js"></script>

</body>

</html>
