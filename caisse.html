<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <meta name="referrer" content="no-referrer">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <script src="js/theme.js"></script>
    <title>Caisse | EJDEN</title>

    <link rel="stylesheet" href="css/modules.css">
</head>

<body>

    <main class="module-page">

        <header class="module-header">

            <a
                href="dashboard.html"
                class="back-button"
                aria-label="Retour au tableau de bord"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>
            </a>

            <div class="module-title">
                <span>FINANCES</span>
                <h1>Caisse</h1>
            </div>

        </header>

        <section class="summary-grid" aria-live="polite">

            <div class="summary-card is-wide" id="balanceCard">
                <span>Solde de la caisse</span>
                <strong id="cashBalance">0</strong>
                <small>FCFA</small>
            </div>

            <div class="summary-card">
                <span>Entrées aujourd'hui</span>
                <strong class="is-in" id="cashTodayIn">0</strong>
                <small>FCFA</small>
            </div>

            <div class="summary-card">
                <span>Sorties aujourd'hui</span>
                <strong class="is-out" id="cashTodayOut">0</strong>
                <small>FCFA</small>
            </div>

        </section>

        <section class="module-section" id="methodsSection" hidden>

            <h2>Encaissé sur les ventes</h2>

            <div id="methodsList"></div>

        </section>

        <section class="module-section" id="cashFormSection">

            <h2>Nouveau mouvement</h2>

            <form id="cashForm" autocomplete="off" novalidate>

                <div class="segmented" role="group" aria-label="Type de mouvement">
                    <button type="button" data-type="in" class="is-active">
                        Entrée
                    </button>

                    <button type="button" data-type="out">
                        Sortie
                    </button>
                </div>

                <div class="field">
                    <label for="cashAmount">Montant (FCFA)</label>

                    <input
                        type="number"
                        id="cashAmount"
                        inputmode="numeric"
                        min="1"
                        step="1"
                        placeholder="Ex. : 10000"
                    >
                </div>

                <div class="field">
                    <label for="cashReason">Motif</label>

                    <input
                        type="text"
                        id="cashReason"
                        maxlength="80"
                        placeholder="Ex. : Fonds de caisse du matin"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-button">
                        Enregistrer
                    </button>
                </div>

            </form>

        </section>

        <section id="cashEmpty" class="empty-state" hidden>
            <strong>Aucun mouvement</strong>
            <p>Les ventes, entrées, sorties et dépenses apparaîtront ici.</p>
        </section>

        <section id="cashList"></section>

    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/caisse.js"></script>

</body>

</html>
