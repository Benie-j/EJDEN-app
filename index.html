<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">


    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <meta name="referrer" content="no-referrer">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#F6F9FA"
    >

    <title>EJDEN</title>

    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <!-- =========================
         SPLASH SCREEN
    ========================== -->

   <section class="splash-screen" id="splashScreen">

        <div class="splash-logo">

            <svg
                class="ejden-symbol"
                viewBox="0 0 120 120"
                aria-hidden="true"
            >

                <circle
                    class="logo-halo"
                    cx="60"
                    cy="60"
                    r="48"
                />

                <path
                    class="logo-line"
                    d="M34 38 C42 28 54 24 67 28 L84 38"
                />

                <path
                    class="logo-line"
                    d="M34 38 L34 63 C34 72 41 79 50 79"
                />

                <path
                    class="logo-line"
                    d="M50 79 L67 92 C72 96 80 95 84 90"
                />

                <path
                    class="logo-line"
                    d="M84 38 L84 65 C84 75 78 82 68 82 L50 82"
                />

                <path
                    class="logo-core"
                    d="M49 58 L70 58"
                />

                <circle
                    class="logo-dot"
                    cx="60"
                    cy="58"
                    r="4"
                />

            </svg>

        </div>

    </section>


    <!-- =========================
         ESPACE EJDEN
    ========================== -->

    <main class="welcome-screen" id="welcomeScreen">

        <section class="welcome-content">

            <div class="logo-container">

                <svg
                    class="ejden-symbol"
                    viewBox="0 0 120 120"
                    aria-hidden="true"
                >

                    <circle
                        class="logo-halo"
                        cx="60"
                        cy="60"
                        r="48"
                    />

                    <path
                        class="logo-line"
                        d="M34 38 C42 28 54 24 67 28 L84 38"
                    />

                    <path
                        class="logo-line"
                        d="M34 38 L34 63 C34 72 41 79 50 79"
                    />

                    <path
                        class="logo-line"
                        d="M50 79 L67 92 C72 96 80 95 84 90"
                    />

                    <path
                        class="logo-line"
                        d="M84 38 L84 65 C84 75 78 82 68 82 L50 82"
                    />

                    <path
                        class="logo-core"
                        d="M49 58 L70 58"
                    />

                    <circle
                        class="logo-dot"
                        cx="60"
                        cy="58"
                        r="4"
                    />

                </svg>

            </div>


            <div class="brand">

                <span class="brand-name">
                    EJDEN
                </span>

                <span class="brand-line"></span>

            </div>


            <div class="welcome-text">

                <span class="eyebrow">
                    VOTRE ESPACE DE GESTION
                </span>

                <h1>
                    Votre espace EJDEN est prêt.
                </h1>

                <p>
                    Commencez à enregistrer vos produits,
                    vos ventes et vos clients.
                </p>

            </div>


            <div class="features">

                <div class="feature">
                    <span class="feature-number">01</span>
                    <span>Produits</span>
                </div>

                <div class="feature">
                    <span class="feature-number">02</span>
                    <span>Ventes</span>
                </div>

                <div class="feature">
                    <span class="feature-number">03</span>
                    <span>Clients</span>
                </div>

            </div>


            <a
                href="dashboard.html"
                class="start-button"
            >

                <span>
                    Accéder à mon espace
                </span>

                <span
                    class="button-arrow"
                    aria-hidden="true"
                >
                    →
                </span>

            </a>

        </section>

    </main>


    <script src="js/index.js"></script>

</body>

</html>
